<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Devang</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #07111f;
        --panel: rgba(10, 20, 36, 0.78);
        --border: rgba(255, 255, 255, 0.12);
        --text: #eef4ff;
        --muted: #9fb1cc;
        --accent: #7ee0c3;
        --accent-2: #8ab4ff;
        --danger: #ff8a8a;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
        --radius: 20px;
      }
      [data-theme="light"] {
        --bg: #f4f7fb;
        --panel: rgba(255, 255, 255, 0.85);
        --border: rgba(10, 20, 36, 0.1);
        --text: #0b1b2f;
        --muted: #5a6b85;
        --shadow: 0 16px 40px rgba(20, 40, 70, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(126, 224, 195, 0.14), transparent 28%),
          radial-gradient(circle at top right, rgba(138, 180, 255, 0.12), transparent 32%),
          var(--bg);
        background-attachment: fixed;
        transition: background 0.2s ease, color 0.2s ease;
      }
      a { color: inherit; }
      .wrap { max-width: 1180px; margin: 0 auto; padding: 24px; }

      header.top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      header.top h1 { font-size: 1.4rem; margin: 0; }
      header.top .actions { display: flex; gap: 10px; align-items: center; }
      .icon-btn {
        width: 40px; height: 40px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        display: grid; place-items: center;
        cursor: pointer;
      }
      .btn {
        padding: 10px 16px;
        border-radius: 999px;
        border: none;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #04101c; }
      .btn-outline { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text); }
      .btn-danger { background: rgba(255, 138, 138, 0.15); color: var(--danger); border: 1px solid rgba(255,138,138,0.3); }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 24px;
      }
      .stat-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 20px;
        box-shadow: var(--shadow);
      }
      .stat-card .num { font-size: 1.7rem; font-weight: 800; }
      .stat-card .label { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }

      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 18px;
      }
      .toolbar input[type="search"], .toolbar select {
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        font-size: 0.9rem;
      }
      .toolbar input[type="search"] { flex: 1; min-width: 180px; }
      .toolbar .spacer { flex: 1; }

      .proj-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        margin-bottom: 40px;
      }
      .proj-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
      }
      .proj-card .thumb {
        height: 130px;
        background: linear-gradient(135deg, rgba(126,224,195,0.14), rgba(138,180,255,0.12));
        display: flex; align-items: center; justify-content: center;
      }
      .proj-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
      .proj-card .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
      .proj-card h3 { margin: 0; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
      .proj-card .badge {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .proj-card p { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
      .proj-card .row { margin-top: auto; display: flex; gap: 8px; }
      .proj-card .row button { flex: 1; padding: 8px; border-radius: 999px; font-size: 0.82rem; }

      .empty {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
      }

      /* Modal */
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.55);
        display: none; align-items: flex-start; justify-content: center;
        overflow-y: auto; padding: 40px 16px; z-index: 50;
      }
      .modal-backdrop.open { display: flex; }
      .modal {
        width: 100%; max-width: 560px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 26px;
      }
      .modal h2 { margin: 0 0 18px; font-size: 1.2rem; }
      .modal label { display: block; font-size: 0.82rem; color: var(--muted); margin: 14px 0 6px; }
      .modal input[type=text], .modal input[type=url], .modal textarea, .modal select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        font-family: inherit;
        font-size: 0.9rem;
      }
      .modal textarea { min-height: 70px; resize: vertical; }
      .modal .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .modal .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
      .modal .checkbox-row input { width: auto; }
      .dropzone {
        margin-top: 6px;
        border: 2px dashed var(--border);
        border-radius: 14px;
        padding: 22px;
        text-align: center;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.85rem;
      }
      .dropzone.dragover { border-color: var(--accent-2); color: var(--text); background: rgba(138,180,255,0.06); }
      .dropzone img { max-height: 100px; border-radius: 8px; margin-bottom: 8px; }
      .modal .footer-row { display: flex; gap: 10px; margin-top: 22px; }
      .modal .footer-row button { flex: 1; padding: 12px; border-radius: 999px; }
      .field-msg { font-size: 0.8rem; color: var(--danger); min-height: 1em; margin-top: 8px; }

      #toast {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        background: var(--panel); border: 1px solid var(--border);
        padding: 12px 20px; border-radius: 999px; box-shadow: var(--shadow);
        font-size: 0.88rem; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        z-index: 60;
      }
      #toast.show { opacity: 1; }

      .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <h1>Project Dashboard</h1>
        <div class="actions">
          <button class="icon-btn" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme">
            <i class="fa-solid fa-moon"></i>
          </button>
          <button class="btn btn-outline" id="export-btn"><i class="fa-solid fa-download"></i> Backup</button>
          <label class="btn btn-outline" style="cursor:pointer;">
            <i class="fa-solid fa-upload"></i> Restore
            <input type="file" id="import-input" accept="application/json" class="visually-hidden" />
          </label>
          <button class="btn btn-outline" id="logout-btn">Log out</button>
        </div>
      </header>

      <div class="stats-grid" id="stats-grid"></div>

      <div class="toolbar">
        <input type="search" id="search-input" placeholder="Search projects…" />
        <select id="filter-category">
          <option value="all">All categories</option>
          <option value="data">Data Analyst</option>
          <option value="web">Web Projects</option>
        </select>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="add-btn"><i class="fa-solid fa-plus"></i> Add project</button>
      </div>

      <div id="proj-grid" class="proj-grid"></div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h2 id="modal-title">Add project</h2>
        <form id="project-form">
          <input type="hidden" id="proj-id" />

          <label for="proj-image">Image</label>
          <div class="dropzone" id="dropzone">
            <div id="dropzone-content">Drag &amp; drop an image, or click to choose one</div>
          </div>
          <input type="file" id="proj-image" accept="image/*" class="visually-hidden" />

          <label for="proj-title">Title</label>
          <input type="text" id="proj-title" required />

          <label for="proj-description">Description</label>
          <textarea id="proj-description" required></textarea>

          <div class="two-col">
            <div>
              <label for="proj-category">Category</label>
              <select id="proj-category" required>
                <option value="data">Data Analyst</option>
                <option value="web">Web</option>
              </select>
            </div>
            <div>
              <label for="proj-tags">Tags (comma separated)</label>
              <input type="text" id="proj-tags" placeholder="Power BI, Dashboard" />
            </div>
          </div>

          <div class="two-col">
            <div>
              <label for="proj-demo">Live demo URL</label>
              <input type="url" id="proj-demo" placeholder="https://…" />
            </div>
            <div>
              <label for="proj-github">GitHub URL</label>
              <input type="url" id="proj-github" placeholder="https://…" />
            </div>
          </div>

          <label for="proj-live">Site URL (for simple web projects)</label>
          <input type="url" id="proj-live" placeholder="https://…" />

          <div class="checkbox-row">
            <input type="checkbox" id="proj-featured" />
            <label for="proj-featured" style="margin:0;">Featured project</label>
          </div>

          <div class="field-msg" id="form-msg"></div>

          <div class="footer-row">
            <button type="button" class="btn btn-outline" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-btn">Save project</button>
          </div>
        </form>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      // ---- Configure these two values (see SETUP-GUIDE.md) ----
      const SUPABASE_URL = "https://mozpazuzxergykwxihuw.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1venBhenV6eGVyZ3lrd3hpaHV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzM3NjMsImV4cCI6MjEwMDU0OTc2M30.Rzsluq00fo_BjgT0-nO1ugjWZw2pqsohxJsCfC7zvDo";
      // -----------------------------------------------------------

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      let allProjects = [];
      let pendingImageFile = null;
      let pendingImagePreviewUrl = null;

      // ---------- Auth guard ----------
      (async function guard() {
        const { data } = await supabase.auth.getSession();
        if (!data.session) window.location.href = "admin-login.html";
      })();

      document.getElementById("logout-btn").addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = "admin-login.html";
      });

      // ---------- Theme ----------
      const themeToggle = document.getElementById("theme-toggle");
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        themeToggle.innerHTML = theme === "light"
          ? '<i class="fa-solid fa-sun"></i>'
          : '<i class="fa-solid fa-moon"></i>';
      }
      let currentTheme = "dark";
      applyTheme(currentTheme);
      themeToggle.addEventListener("click", () => {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(currentTheme);
      });

      // ---------- Toast ----------
      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 2200);
      }

      // ---------- Load + render ----------
      async function loadProjects() {
        const { data, error } = await supabase
          .from("projects")
          .select("*")
          .order("sort_order", { ascending: true });
        if (error) {
          toast("Couldn't load projects: " + error.message);
          return;
        }
        allProjects = data;
        renderStats();
        renderGrid();
      }

      function renderStats() {
        const total = allProjects.length;
        const data = allProjects.filter((p) => p.category === "data").length;
        const web = allProjects.filter((p) => p.category === "web").length;
        const featured = allProjects.filter((p) => p.featured).length;
        const stats = [
          { label: "Total projects", num: total },
          { label: "Data Analyst", num: data },
          { label: "Web Projects", num: web },
          { label: "Featured", num: featured },
        ];
        document.getElementById("stats-grid").innerHTML = stats
          .map((s) => `<div class="stat-card"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`)
          .join("");
      }

      function renderGrid() {
        const search = document.getElementById("search-input").value.trim().toLowerCase();
        const cat = document.getElementById("filter-category").value;
        const filtered = allProjects.filter((p) => {
          const matchesCat = cat === "all" || p.category === cat;
          const matchesSearch =
            !search ||
            p.title.toLowerCase().includes(search) ||
            p.description.toLowerCase().includes(search) ||
            (p.tags || []).some((t) => t.toLowerCase().includes(search));
          return matchesCat && matchesSearch;
        });

        const grid = document.getElementById("proj-grid");
        if (filtered.length === 0) {
          grid.innerHTML = `<div class="empty">No projects match. Try a different search, or add a new project.</div>`;
          return;
        }

        grid.innerHTML = filtered
          .map((p) => `
            <article class="proj-card">
              <div class="thumb">${p.image_url ? `<img src="${escapeAttr(p.image_url)}" alt="${escapeAttr(p.title)}" />` : ""}</div>
              <div class="body">
                <h3>${escapeHtml(p.title)} ${p.featured ? '<span class="badge">Featured</span>' : ""}</h3>
                <p>${escapeHtml(p.description)}</p>
                <div class="row">
                  <button class="btn btn-outline" onclick="editProject('${p.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                  <button class="btn btn-danger" onclick="deleteProject('${p.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                </div>
              </div>
            </article>
          `)
          .join("");
      }

      function escapeHtml(str) {
        return (str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }
      function escapeAttr(str) { return escapeHtml(str); }

      document.getElementById("search-input").addEventListener("input", renderGrid);
      document.getElementById("filter-category").addEventListener("change", renderGrid);

      // ---------- Modal open/close ----------
      const backdrop = document.getElementById("modal-backdrop");
      const form = document.getElementById("project-form");
      const dropzone = document.getElementById("dropzone");
      const dropzoneContent = document.getElementById("dropzone-content");
      const imageInput = document.getElementById("proj-image");

      function openModal(project) {
        form.reset();
        pendingImageFile = null;
        pendingImagePreviewUrl = null;
        document.getElementById("form-msg").textContent = "";
        document.getElementById("proj-id").value = project ? project.id : "";
        document.getElementById("modal-title").textContent = project ? "Edit project" : "Add project";

        if (project) {
          document.getElementById("proj-title").value = project.title;
          document.getElementById("proj-description").value = project.description;
          document.getElementById("proj-category").value = project.category;
          document.getElementById("proj-tags").value = (project.tags || []).join(", ");
          document.getElementById("proj-demo").value = project.demo_url || "";
          document.getElementById("proj-github").value = project.github_url || "";
          document.getElementById("proj-live").value = project.live_url || "";
          document.getElementById("proj-featured").checked = !!project.featured;
          dropzoneContent.innerHTML = project.image_url
            ? `<img src="${escapeAttr(project.image_url)}" alt="" /><div>Click or drop to replace</div>`
            : "Drag & drop an image, or click to choose one";
        } else {
          dropzoneContent.textContent = "Drag & drop an image, or click to choose one";
        }

        backdrop.classList.add("open");
      }

      function closeModal() { backdrop.classList.remove("open"); }

      document.getElementById("add-btn").addEventListener("click", () => openModal(null));
      document.getElementById("cancel-btn").addEventListener("click", closeModal);
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); });

      window.editProject = function (id) {
        const project = allProjects.find((p) => p.id === id);
        if (project) openModal(project);
      };

      window.deleteProject = async function (id) {
        const project = allProjects.find((p) => p.id === id);
        if (!project) return;
        if (!confirm(`Delete "${project.title}"? This can't be undone.`)) return;
        const { error } = await supabase.from("projects").delete().eq("id", id);
        if (error) { toast("Delete failed: " + error.message); return; }
        toast("Project deleted");
        loadProjects();
      };

      // ---------- Drag & drop image ----------
      dropzone.addEventListener("click", () => imageInput.click());
      dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
      dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
        if (e.dataTransfer.files && e.dataTransfer.files[0]) handleImageFile(e.dataTransfer.files[0]);
      });
      imageInput.addEventListener("change", () => {
        if (imageInput.files[0]) handleImageFile(imageInput.files[0]);
      });

      function handleImageFile(file) {
        if (!file.type.startsWith("image/")) { toast("Please choose an image file"); return; }
        pendingImageFile = file;
        pendingImagePreviewUrl = URL.createObjectURL(file);
        dropzoneContent.innerHTML = `<img src="${pendingImagePreviewUrl}" alt="" /><div>Click or drop to replace</div>`;
      }

      // ---------- Save (insert or update) ----------
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById("save-btn");
        const msgEl = document.getElementById("form-msg");
        msgEl.textContent = "";
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";

        try {
          const id = document.getElementById("proj-id").value || null;
          const title = document.getElementById("proj-title").value.trim();
          const slug = slugify(title);
          const description = document.getElementById("proj-description").value.trim();
          const category = document.getElementById("proj-category").value;
          const tags = document.getElementById("proj-tags").value
            .split(",").map((t) => t.trim()).filter(Boolean);
          const demo_url = document.getElementById("proj-demo").value.trim() || null;
          const github_url = document.getElementById("proj-github").value.trim() || null;
          const live_url = document.getElementById("proj-live").value.trim() || null;
          const featured = document.getElementById("proj-featured").checked;

          let image_url = null;
          const existing = id ? allProjects.find((p) => p.id === id) : null;
          if (existing) image_url = existing.image_url;

          if (pendingImageFile) {
            const path = `${slug}-${Date.now()}.${pendingImageFile.name.split(".").pop()}`;
            const { error: uploadError } = await supabase.storage
              .from("project-images")
              .upload(path, pendingImageFile, { upsert: true });
            if (uploadError) throw uploadError;
            const { data: publicUrlData } = supabase.storage.from("project-images").getPublicUrl(path);
            image_url = publicUrlData.publicUrl;
          }

          const payload = { title, slug, description, category, tags, demo_url, github_url, live_url, featured, image_url };

          let error;
          if (id) {
            ({ error } = await supabase.from("projects").update(payload).eq("id", id));
          } else {
            payload.sort_order = allProjects.length + 1;
            ({ error } = await supabase.from("projects").insert(payload));
          }
          if (error) throw error;

          toast(id ? "Project updated" : "Project added");
          closeModal();
          loadProjects();
        } catch (err) {
          msgEl.textContent = err.message || "Something went wrong. Please try again.";
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save project";
        }
      });

      function slugify(str) {
        return str.toLowerCase().trim()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
      }

      // ---------- Backup / Restore ----------
      document.getElementById("export-btn").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(allProjects, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `projects-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        toast("Backup downloaded");
      });

      document.getElementById("import-input").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const projects = JSON.parse(text);
          if (!Array.isArray(projects)) throw new Error("File doesn't look like a projects backup");
          if (!confirm(`Restore ${projects.length} project(s)? Existing projects with the same slug will be overwritten.`)) return;

          const cleaned = projects.map(({ id, created_at, updated_at, ...rest }) => rest);
          const { error } = await supabase.from("projects").upsert(cleaned, { onConflict: "slug" });
          if (error) throw error;

          toast("Restore complete");
          loadProjects();
        } catch (err) {
          toast("Restore failed: " + err.message);
        } finally {
          e.target.value = "";
        }
      });

      // ---------- Init ----------
      loadProjects();
    </script>
  </body>
</html>
