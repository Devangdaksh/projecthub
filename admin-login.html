<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Devang</title>
    <meta name="robots" content="noindex" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #07111f;
        --panel: rgba(10, 20, 36, 0.78);
        --border: rgba(255, 255, 255, 0.12);
        --text: #eef4ff;
        --muted: #9fb1cc;
        --accent: #7ee0c3;
        --accent-2: #8ab4ff;
        --danger: #ff8a8a;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
        --radius: 24px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, sans-serif;
        color: var(--text);
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(126, 224, 195, 0.18), transparent 28%),
          radial-gradient(circle at top right, rgba(138, 180, 255, 0.16), transparent 32%),
          linear-gradient(160deg, var(--bg) 0%, #0b1b2f 45%, var(--bg) 100%);
        background-attachment: fixed;
      }
      .card {
        width: 100%;
        max-width: 380px;
        margin: 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 32px;
      }
      .card h1 {
        font-size: 1.3rem;
        margin: 0 0 4px;
      }
      .card p.sub {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 0.92rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin: 16px 0 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 0.95rem;
      }
      input:focus {
        outline: 2px solid var(--accent-2);
        outline-offset: 1px;
      }
      button {
        margin-top: 24px;
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #04101c;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .msg {
        margin-top: 14px;
        font-size: 0.87rem;
        min-height: 1.2em;
        color: var(--danger);
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.85rem;
        text-decoration: none;
      }
      .back:hover { color: var(--text); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Admin Login</h1>
      <p class="sub">Sign in to manage your project listings.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <div class="msg" id="msg"></div>
        <button id="submit-btn" type="submit">Sign in</button>
      </form>
      <a class="back" href="index.html">&larr; Back to portfolio</a>
    </div>

    <script>
      // ---- Configure these two values (see SETUP-GUIDE.md) ----
      const SUPABASE_URL = "https://mozpazuzxergykwxihuw.supabase.co/rest/v1/";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1venBhenV6eGVyZ3lrd3hpaHV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzM3NjMsImV4cCI6MjEwMDU0OTc2M30.Rzsluq00fo_BjgT0-nO1ugjWZw2pqsohxJsCfC7zvDo";
      // -----------------------------------------------------------

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const form = document.getElementById("login-form");
      const msg = document.getElementById("msg");
      const btn = document.getElementById("submit-btn");

      // If already logged in, skip straight to the dashboard
      supabase.auth.getSession().then(({ data }) => {
        if (data.session) window.location.href = "admin-dashboard.html";
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "";
        btn.disabled = true;
        btn.textContent = "Signing in…";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          msg.textContent = "Couldn't sign in — check your email and password.";
          btn.disabled = false;
          btn.textContent = "Sign in";
          return;
        }

        window.location.href = "admin-dashboard.html";
      });
    </script>
  </body>
</html>
