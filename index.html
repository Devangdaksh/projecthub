<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects Hub</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #fff;
    }

    header {
        text-align: center;
        padding: 30px;
        font-size: 28px;
        font-weight: bold;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 25px;
        padding: 30px;
    }

    .card {
        background: #1e293b;
        border-radius: 15px;
        overflow: hidden;
        transition: 0.3s;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .card:hover {
        transform: translateY(-8px);
    }

    .card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
    }

    .card-content {
        padding: 15px;
        text-align: center;
    }

    .card-content h3 {
        margin: 10px 0;
    }

    .card-content a {
        display: inline-block;
        margin-top: 10px;
        padding: 8px 15px;
        background: #38bdf8;
        color: #000;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
    }

    .card-content a:hover {
        background: #0ea5e9;
    }

    .icon {
        margin-right: 8px;
    }

    footer {
        text-align: center;
        padding: 15px;
        background: #1e293b;
        font-size: 14px;
    }
</style>
</head>

<body>

<header>
    🚀 My GitHub Projects Hub
</header>

<div class="container">

    <!-- QR Code Generator -->
    <div class="card">
        <img src="image/qr.png" alt="QR Generator">
        <div class="card-content">
            <h3><i class="fa-solid fa-qrcode icon"></i>QR & Barcode Generator</h3>
            <a href="https://Devangdaksh.github.io/QRandBAR.code.generater/" target="_blank">
                Visit Site
            </a>
        </div>
    </div>

    <!-- Weather -->
    <div class="card">
        <img src="image/weath.png" alt="Weather">
        <div class="card-content">
            <h3><i class="fa-solid fa-cloud-sun icon"></i>Weather App</h3>
            <a href="https://yourusername.github.io/Weather.site" target="_blank">
                Visit Site
            </a>
        </div>
    </div>

    <!-- Clock -->
    <div class="card">
        <img src="image/clock.png" alt="Clock">
        <div class="card-content">
            <h3><i class="fa-solid fa-clock icon"></i>Clock App</h3>
            <a href="https://devangdaksh.github.io/clocky/" target="_blank">
                Visit Site
            </a>
        </div>
    </div>

    <!-- YouTube Downloader -->
    <div class="card">
        <img src="image/youtube.png" alt="YouTube Downloader">
        <div class="card-content">
            <h3><i class="fa-brands fa-youtube icon"></i>YouTube Downloader(currently working on this project for a while)</h3>
            <a href="https://yourusername.github.io/youtube-video-downloader" target="_blank">
                Visit Site
            </a>
        </div>
    </div>

</div>

<footer>
    © 2026 Your Name | All Projects in One Place
</footer>

</body>
</html>
