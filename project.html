<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Project | Devang</title>
    <meta id="page-description" name="description" content="A project by Devang." />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #07111f; --panel: rgba(10, 20, 36, 0.78); --border: rgba(255, 255, 255, 0.12);
        --text: #eef4ff; --muted: #9fb1cc; --accent: #7ee0c3; --accent-2: #8ab4ff;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.28); --radius: 24px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; font-family: Inter, sans-serif; color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(126, 224, 195, 0.18), transparent 28%),
          radial-gradient(circle at top right, rgba(138, 180, 255, 0.16), transparent 32%),
          linear-gradient(160deg, var(--bg) 0%, #0b1b2f 45%, var(--bg) 100%);
        background-attachment: fixed;
      }
      a { color: inherit; text-decoration: none; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 40px 24px 60px; }
      .back-link { color: var(--muted); font-size: 0.9rem; }
      .back-link:hover { color: var(--text); }
      .hero-img { margin-top: 20px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
      .hero-img img { width: 100%; display: block; max-height: 420px; object-fit: cover; }
      h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 28px 0 8px; }
      .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
      .tags span { padding: 6px 12px; border-radius: 999px; font-size: 0.82rem; background: rgba(255,255,255,0.06); color: var(--muted); }
      .desc { color: var(--muted); line-height: 1.8; font-size: 1rem; }
      .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      .buttons a { padding: 12px 18px; border-radius: 999px; font-weight: 700; }
      .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #04101c; }
      .btn-outline { background: rgba(255,255,255,0.06); border: 1px solid var(--border); }
      .state { text-align: center; color: var(--muted); padding: 80px 20px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back-link" href="index.html">&larr; Back to all projects</a>
      <div id="content">
        <div class="state">Loading project…</div>
      </div>
    </div>

    <script>
      // ---- Configure these two values (see SETUP-GUIDE.md) ----
      const SUPABASE_URL = "https://mozpazuzxergykwxihuw.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1venBhenV6eGVyZ3lrd3hpaHV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzM3NjMsImV4cCI6MjEwMDU0OTc2M30.Rzsluq00fo_BjgT0-nO1ugjWZw2pqsohxJsCfC7zvDo";
      // -----------------------------------------------------------

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const content = document.getElementById("content");

      function escapeHtml(str) {
        return (str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      async function load() {
        if (!slug) {
          content.innerHTML = `<div class="state">No project specified.</div>`;
          return;
        }
        const { data: project, error } = await supabase
          .from("projects").select("*").eq("slug", slug).single();

        if (error || !project) {
          content.innerHTML = `<div class="state">Project not found.</div>`;
          return;
        }

        document.getElementById("page-title").textContent = `${project.title} | Devang`;
        document.getElementById("page-description").setAttribute("content", project.description);

        const links = [];
        if (project.demo_url && project.demo_url !== "#") links.push(`<a class="btn-primary" href="${escapeHtml(project.demo_url)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Live Demo</a>`);
        if (project.live_url) links.push(`<a class="btn-primary" href="${escapeHtml(project.live_url)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Visit Site</a>`);
        if (project.github_url && project.github_url !== "#") links.push(`<a class="btn-outline" href="${escapeHtml(project.github_url)}" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a>`);

        content.innerHTML = `
          ${project.image_url ? `<div class="hero-img"><img src="${escapeHtml(project.image_url)}" alt="${escapeHtml(project.title)}" /></div>` : ""}
          <h1>${escapeHtml(project.title)}</h1>
          <div class="tags">${(project.tags || []).map((t) => `<span>${escapeHtml(t)}</span>`).join("")}</div>
          <p class="desc">${escapeHtml(project.description)}</p>
          <div class="buttons">${links.join("")}</div>
        `;
      }

      load();
    </script>
  </body>
</html>
